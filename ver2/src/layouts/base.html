<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf8">
  <meta name="google-site-verification" content="google382eb4ad681ea1fc">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://shoji-mori.github.io/me.jpg">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-wave-32.png?v=gray-green-sharp">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/images/favicon-wave.svg?v=gray-green-sharp">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon-wave.png?v=gray-green-sharp">
  <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/outfit-latin-500-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css?v=site-wordmark-20261014">
  <script>
    try { if (sessionStorage.getItem('site-language') === 'ja') { document.documentElement.classList.add('lang-ja'); document.documentElement.lang = 'ja'; } } catch {}
  </script>
  <script type="application/ld+json">{{structuredData}}</script>
  <script src="/site.js?v=english-default-20261015" type="module"></script>
  <noscript><style>.filters,.clear-filters,[data-bibtex],[data-print],.language-switch,.contact-disclosure,.menu-toggle{display:none!important}.mobile-nav[hidden]{display:flex!important;flex-wrap:wrap;gap:0 20px}</style></noscript>
</head>
<body class="{{pageClass}}">
  <a class="skip-link" href="#main"><span class="en" lang="en">Skip to content</span><span class="ja" lang="ja">本文へ</span></a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="/" aria-label="Shoji Mori — Home"><img class="wordmark-symbol" src="/images/logo-mark.svg?v=gray-green-sharp" width="88" height="32" alt=""><span class="wordmark-name">Shoji Mori</span></a>
      <nav class="desktop-nav" aria-label="Main navigation">{{navigation}}</nav>
      <div class="header-controls">
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
        </div>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav" aria-label="Navigation menu"><span></span><span></span></button>
      </div>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation" hidden>{{navigation}}</nav>
  </header>
  <main id="main" tabindex="-1">{{content}}</main>
  <footer class="site-footer">
    <div class="container footer-row"><span>© {{year}} Shoji Mori</span><a href="mailto:{{siteEmail}}">{{siteEmail}}</a><span><span class="en" lang="en">Last updated</span><span class="ja" lang="ja">最終更新</span> {{updated}}</span><a href="#main"><span class="en" lang="en">Back to top</span><span class="ja" lang="ja">ページ上部へ</span></a></div>
  </footer>
  <p id="copy-status" class="toast" role="status" aria-live="polite"></p>
</body>
</html>
